spring.application.name=mundial-app

# Conexión a SQL Server (instancia SQLEXPRESS con TCP/IP en el puerto fijo 1433).
# Las credenciales NO van en el repositorio: se leen de las variables de entorno DB_USER y DB_PASSWORD.
# DB_URL es opcional: permite apuntar a otro servidor o puerto sin tocar este archivo.
# Ver application.properties.example.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=MundialFutbol;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
