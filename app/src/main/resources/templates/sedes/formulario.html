<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${form.esAlta()} ? 'Nueva sede · Mundial de Fútbol' : 'Editar sede · Mundial de Fútbol'">Sede</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        /* El mensaje consolidado del SP trae un renglón por validación. */
        .mensaje { white-space: pre-line; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/sedes}">Mundial de Fútbol · Gestión de sedes</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" aria-current="page" th:href="@{/sedes}">Sedes</a>
            <a class="nav-link" th:href="@{/scraping}">Scraping</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 720px;">
    <h1 class="h3 mb-3" th:text="${form.esAlta()} ? 'Nueva sede' : 'Editar sede ' + ${form.idSede}">Sede</h1>

    <div th:if="${error}" class="alert alert-danger mensaje" role="alert" th:text="${error}"></div>

    <!-- Sin "required" ni validaciones en el navegador: las reglas las valida el SP y devuelve un único mensaje. -->
    <form method="post" class="card card-body"
          th:object="${form}"
          th:action="${form.esAlta()} ? @{/sedes} : @{/sedes/{id}(id=${form.idSede})}">

        <div class="mb-3">
            <label for="nombreEstadio" class="form-label">Nombre del estadio</label>
            <input type="text" class="form-control" th:field="*{nombreEstadio}">
        </div>

        <div class="mb-3">
            <label for="idCiudad" class="form-label">Ciudad</label>
            <select class="form-select" th:field="*{idCiudad}">
                <option value="">Seleccionar...</option>
                <option th:each="c : ${ciudades}" th:value="${c.idCiudad()}" th:text="${c.etiqueta()}"></option>
            </select>
            <div class="form-text">El huso horario de la sede es el de su ciudad.</div>
        </div>

        <div class="mb-3">
            <label for="capacidad" class="form-label">Capacidad <span class="text-muted">(opcional)</span></label>
            <input type="number" class="form-control" th:field="*{capacidad}">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="latitud" class="form-label">Latitud <span class="text-muted">(opcional)</span></label>
                <input type="number" step="0.000001" class="form-control" th:field="*{latitud}">
            </div>
            <div class="col-md-6 mb-3">
                <label for="longitud" class="form-label">Longitud <span class="text-muted">(opcional)</span></label>
                <input type="number" step="0.000001" class="form-control" th:field="*{longitud}">
            </div>
            <div class="form-text mb-3 mt-0">Latitud y longitud van juntas o ninguna (se usan en el mapa del tablero de BI).</div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="${form.esAlta()} ? 'Dar de alta' : 'Guardar cambios'">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/sedes}">Cancelar</a>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
