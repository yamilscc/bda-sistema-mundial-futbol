<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sedes · Mundial de Fútbol</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        /* El mensaje consolidado del SP trae un renglón por validación. */
        .mensaje { white-space: pre-line; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">Mundial de Fútbol · Gestión de sedes</span>
    </div>
</nav>

<main class="container">
    <div th:if="${ok}" class="alert alert-success mensaje" role="alert" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger mensaje" role="alert" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Sedes</h1>
        <a class="btn btn-primary" th:href="@{/sedes/nueva}">Nueva sede</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>Id</th>
                <th>Estadio</th>
                <th>Ciudad</th>
                <th>País</th>
                <th>Huso horario</th>
                <th class="text-end">Capacidad</th>
                <th class="text-end">Latitud</th>
                <th class="text-end">Longitud</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(sedes)}">
                <td colspan="9" class="text-center text-muted">No hay sedes cargadas.</td>
            </tr>
            <tr th:each="s : ${sedes}">
                <td th:text="${s.idSede()}"></td>
                <td th:text="${s.nombreEstadio()}"></td>
                <td th:text="${s.ciudad()}"></td>
                <td th:text="${s.pais()}"></td>
                <td th:text="${s.husoHorario()}"></td>
                <td class="text-end" th:text="${s.capacidad() != null ? #numbers.formatInteger(s.capacidad(), 1, 'POINT') : '-'}"></td>
                <td class="text-end" th:text="${s.latitud() != null ? s.latitud() : '-'}"></td>
                <td class="text-end" th:text="${s.longitud() != null ? s.longitud() : '-'}"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/sedes/{id}/editar(id=${s.idSede()})}">Editar</a>
                    <form class="d-inline" method="post"
                          th:action="@{/sedes/{id}/baja(id=${s.idSede()})}"
                          th:data-nombre="${s.nombreEstadio()}"
                          onsubmit="return confirm('¿Dar de baja la sede «' + this.dataset.nombre + '»?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Baja</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted small">
        Las altas, modificaciones y bajas se hacen con los SP nucleo.SP_ALTA_Sede, nucleo.SP_MODIFICACION_Sede
        y nucleo.SP_BAJA_Sede (script 09).
    </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
